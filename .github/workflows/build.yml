# Builds the game for every platform, runs the smoke test, publishes the Web
# build to GitHub Pages (pushes to main) and attaches desktop builds to a
# GitHub Release (tags like v0.1.0).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

          # Only extract the templates we use; the full archive is ~1.3 GB.
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates_dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates_dir"
          unzip -q -j templates.tpz \
            templates/version.txt \
            templates/web_nothreads_release.zip \
            templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe \
            templates/macos.zip \
            -d "$templates_dir"
          rm godot.zip templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Smoke test
        run: ~/godot/godot --headless --path . res://tests/smoke_test.tscn

      - name: Export builds
        run: |
          export_preset() {
            mkdir -p "$(dirname "$2")"
            ~/godot/godot --headless --path . --export-release "$1" "$2"
            test -e "$2"
          }
          export_preset "Web"     build/web/index.html
          export_preset "Windows" build/windows/MaxPain.exe
          export_preset "Linux"   build/linux/MaxPain.x86_64
          export_preset "macOS"   build/macos/MaxPain.zip

      - name: Package desktop builds
        run: |
          mkdir -p dist
          (cd build/windows && zip -q ../../dist/MaxPain-windows.zip MaxPain.exe)
          (cd build/linux && zip -q ../../dist/MaxPain-linux.zip MaxPain.x86_64)
          cp build/macos/MaxPain.zip dist/MaxPain-macos.zip

      - name: Upload desktop builds
        uses: actions/upload-artifact@v7
        with:
          name: desktop-builds
          path: dist/

      - name: Upload Web build for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-builds
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
